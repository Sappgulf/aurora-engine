[project]
name = "Aurora Engine"
default_game = "last_light"

[games.last_light]
package = "last_light"
root = "games/last-light"
web_root = "games/last-light"
asset_root = "games/last-light/assets"

[games.aurora_run]
package = "aurora_run"
root = "games/aurora-run"
web_root = "games/aurora-run"
asset_root = "games/aurora-run/assets"

[validation]
native = "cargo check --workspace"
test = "cargo test --workspace"
web = "cargo check --workspace --target wasm32-unknown-unknown"
